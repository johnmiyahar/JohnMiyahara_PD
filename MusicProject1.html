<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Esplanade In Youthful Company 2024 - A music performance at Singapore's Esplanade venue.">
    <title>Esplanade Performance 2024 - Music Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/jrmlogo.png">
</head>
<body>
    <a href="#home" class="skip-link">Skip to main content</a>
    <nav class="navbar">
        <div class="logo"><img src="images/jrmlogo.png" alt="John Miyahara Logo" loading="lazy"/></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>
    <section id="home" class="flex-section">
        <div class="text-container">
            <h1>
                Esplanade In Youthful Company 2024
            </h1>
            <p>I represented Republic Polytechnic in this performance, under Jammerz Arena, another interest group in RP.</p>
        </div>
        <img src="images/esplanade1.jpg" alt="Esplanade Photo 1" loading="lazy" />
        <img src="images/esplanade2.jpg" alt="Esplanade Photo 2" loading="lazy" />
    </section>

    <footer>
        <p>&copy; 2026 John Miyahara.</p>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            const menuToggle = document.querySelector('.menu-toggle');
            const isOpen = navLinks.classList.contains('show');
            
            navLinks.classList.toggle('show');
            menuToggle.setAttribute('aria-expanded', !isOpen);
        }
    </script>
</body>
</html>
