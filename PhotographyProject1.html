<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Uncle and Cousin - A portrait photography taken at a beach stop in Malaysia.">
    <title>Beach Portrait - Photography Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/jrmlogo.png">
</head>
<body>
    <a href="#home" class="skip-link">Skip to main content</a>
    <nav class="navbar">
        <div class="logo"><img src="images/jrmlogo.png" alt="John Miyahara Logo" loading="lazy"/></div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>
    <section id="home" class="flex-section">
        <div class="text-container">
            <h1>
                My Uncle and Cousin
            </h1>
            <p>Along the coast in Malaysia on the way to Kuala Lumpur, my family took a stop near a beach.</p>
        </div>
        <img src="images/titoandbesh.jpg" alt="Uncle and Cousin Photo" loading="lazy" />
    </section>

    <footer>
        <p>&copy; 2026 John Miyahara.</p>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            const menuToggle = document.querySelector('.menu-toggle');
            const isOpen = navLinks.classList.contains('show');
            
            navLinks.classList.toggle('show');
            menuToggle.setAttribute('aria-expanded', !isOpen);
        }
    </script>
</body>
</html>
